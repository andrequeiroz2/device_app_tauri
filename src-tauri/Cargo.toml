[package]
name = "device_app"
version = "0.1.0"
description = "A Tauri App"
authors = ["andrequeiroz"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "device_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-error = "0.2"
uuid = { version = "1.20.0", features = ["v4"] }
rsa = { version = "0.9.10", features = ["pem"] }
rand = "0.10.0"
password-hash = { version = "0.5", features = ["rand_core"] }

sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
log = "0.4"

# Collector (MQTT + HTTP API)
actix-web = "4.4"
actix-rt = "2.9"
crossbeam-channel = "0.5"
paho-mqtt = "0.12"
tokio = { version = "1", features = ["full"] }

#jsonwebtoken
jwt_lib = { git = "https://github.com/andrequeiroz2/lib_jwt" }
scrypt = "0.11.0"

#image
base64 = "0.22"
sha2 = "0.10.9"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

#datetime
chrono = { version = "0.4", features = ["serde"] }

# Serial communication (device provisioning)
tokio-serial = "5.4"
serialport = "4.3"

[dev-dependencies]
mockito = "1"
